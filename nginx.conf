server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip on for text assets — Cloud Run terminates TLS, this is fine.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
  gzip_min_length 1024;

  # Long-cache fingerprinted Vite assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Static files at the root (favicon, manifest, etc.) — short cache.
  location ~* \.(?:js|css|svg|woff2?|ttf|otf|webp|jpg|jpeg|png|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # index.html should never be cached so users get fresh deploys.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback for react-router-dom client routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
